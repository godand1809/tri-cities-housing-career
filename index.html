<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c6b62" />
  <meta name="description" content="Tri-Cities Housing & Career Assistant — track housing applications, job leads, and documents for Benton & Franklin Counties." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TC Assistant" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c6b62'/%3E%3Cpath d='M16 36 L32 20 L48 36 V48 H38 V38 H26 V48 H16 Z' fill='none' stroke='%23f4f7f6' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <title>Tri-Cities Housing & Career Assistant</title>
  <style>
    :root {
      --bg: #f4f7f6; --surface: #ffffff; --surface-2: #eef3f1; --fg: #1a2422; --muted: #5a6b66;
      --border: #d5e0dc; --primary: #1c6b62; --primary-fg: #f4f7f6; --accent: #a6532d; --accent-soft: #f6ebe5;
      --ok: #1f7a4d; --warn: #9a6b12; --danger: #a33b3b;
      --shadow: 0 1px 3px rgba(26,36,34,.08), 0 8px 24px rgba(26,36,34,.06);
      --radius: 14px; --nav-h: 64px;
      --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .dark {
      --bg: #0f1614; --surface: #17201d; --surface-2: #1e2a26; --fg: #e8efec; --muted: #9aaba5;
      --border: #2a3a35; --primary: #3aa899; --primary-fg: #0b1412; --accent: #d4845a; --accent-soft: #2a2018;
      --ok: #4caf7a; --warn: #d4a017; --danger: #e07070;
      --shadow: 0 1px 3px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; font-family: var(--font); background: var(--bg); color: var(--fg); line-height: 1.45;
      padding-top: var(--safe-t); padding-bottom: calc(var(--nav-h) + var(--safe-b) + 12px); min-height: 100dvh;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--primary); }
    .wrap { max-width: 720px; margin: 0 auto; padding: 12px 14px 24px; }
    header.app-bar {
      position: sticky; top: 0; z-index: 20;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 10px 14px;
    }
    header .inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
    .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--primary); display: grid; place-items: center; flex-shrink: 0; }
    .logo svg { width: 22px; height: 22px; }
    .brand { flex: 1; min-width: 0; }
    .brand h1 { margin: 0; font-size: 0.95rem; font-weight: 700; letter-spacing: -.01em; }
    .brand p { margin: 0; font-size: 0.72rem; color: var(--muted); }
    .icon-btn {
      border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
      width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; color: var(--fg);
    }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px;
    }
    .card h2 { margin: 0 0 8px; font-size: 1rem; }
    .card h3 { margin: 0 0 6px; font-size: 0.92rem; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { background: var(--surface-2); border-radius: 12px; padding: 10px 8px; text-align: center; }
    .stat .n { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
    .stat .l { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .btn {
      appearance: none; border: none; border-radius: 10px; padding: 10px 14px;
      background: var(--primary); color: var(--primary-fg); font-weight: 600; cursor: pointer;
      min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
    }
    .btn.secondary { background: var(--surface-2); color: var(--fg); border: 1px solid var(--border); }
    .btn.ghost { background: transparent; color: var(--primary); border: 1px solid var(--border); }
    .btn.danger { background: var(--danger); color: #fff; }
    .btn.sm { padding: 7px 10px; min-height: 36px; font-size: 0.85rem; }
    .btn.block { width: 100%; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
    }
    .chip.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); border-color: transparent; }
    .chip.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); border-color: transparent; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--surface); scroll-margin-top: 70px; }
    .item.due { border-color: color-mix(in srgb, var(--warn) 50%, var(--border)); }
    .item summary { cursor: pointer; list-style: none; }
    .item summary::-webkit-details-marker { display: none; }
    .item .body { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    label.field { display: block; margin-bottom: 10px; }
    label.field > span { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    input[type="text"], input[type="tel"], input[type="email"], input[type="date"], input[type="number"],
    select, textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); min-height: 44px;
    }
    textarea { min-height: 88px; resize: vertical; }
    .check-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .check-row:last-child { border-bottom: none; }
    .check-row input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--primary); flex-shrink: 0; }
    .check-row.done span { text-decoration: line-through; color: var(--muted); }
    .nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface);
      border-top: 1px solid var(--border); padding-bottom: var(--safe-b);
      height: calc(var(--nav-h) + var(--safe-b)); display: grid; grid-template-columns: repeat(5, 1fr);
    }
    .nav button {
      border: none; background: transparent; color: var(--muted); padding: 6px 2px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 0.65rem; font-weight: 600; cursor: pointer; position: relative;
    }
    .nav button.active { color: var(--primary); }
    .nav button .dot {
      position: absolute; top: 4px; right: calc(50% - 16px);
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    }
    .nav svg { width: 22px; height: 22px; }
    .toast {
      position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
      transform: translateX(-50%) translateY(20px); opacity: 0;
      background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px;
      font-size: 0.85rem; font-weight: 600; z-index: 50; pointer-events: none;
      transition: .25s ease; white-space: nowrap; max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
    .filters button {
      flex-shrink: 0; border: 1px solid var(--border); background: var(--surface);
      border-radius: 999px; padding: 6px 12px; font-size: 0.78rem; font-weight: 600;
      color: var(--muted); cursor: pointer; min-height: 34px;
    }
    .filters button.on { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .statement {
      background: #fff; color: #111; border: 1px solid #ccc; border-radius: 8px;
      padding: 16px; font-family: Georgia, "Times New Roman", serif; font-size: 0.92rem;
      white-space: pre-wrap; line-height: 1.55;
    }
    .dark .statement { background: #fafafa; color: #111; }
    .warning {
      background: color-mix(in srgb, var(--warn) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--border));
      border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; margin: 10px 0;
    }
    .empty { text-align: center; padding: 24px 12px; color: var(--muted); }
    .group-title {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); font-weight: 700; margin: 14px 0 6px;
    }
    .actions-list { margin: 0; padding-left: 18px; }
    .actions-list li { margin-bottom: 8px; }
    @media print {
      body { background: #fff; color: #000; padding: 0; }
      header.app-bar, .nav, .no-print { display: none !important; }
      .statement { border: none; }
      .wrap { max-width: none; padding: 0; }
    }
  </style>
</head>
<body>
  <header class="app-bar">
    <div class="inner">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f4f7f6" stroke-width="2" stroke-linejoin="round">
          <path d="M4 12 L12 4 L20 12 V20 H15 V14 H9 V20 H4 Z"/>
        </svg>
      </div>
      <div class="brand">
        <h1>Tri-Cities Housing & Career</h1>
        <p>Benton & Franklin Counties · Offline-ready</p>
      </div>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle dark mode" title="Theme">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <main class="wrap" id="app"></main>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
